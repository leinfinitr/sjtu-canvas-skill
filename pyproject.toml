[project]
name = "sjtu-canvas-skill"
version = "0.1.0"
description = "Agent-oriented CLI for SJTU Canvas course files, classroom video subtitles, and study-note generation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "leinfinitr" },
]
keywords = ["sjtu", "canvas", "lms", "subtitle", "study-notes", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "asyncclick>=8.0",
    "aiohttp[speedups]>=3.9.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.0",
    "lxml>=5.0",
    "requests>=2.31",
    "pymupdf>=1.24",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/leinfinitr/sjtu-canvas-skill"
Repository = "https://github.com/leinfinitr/sjtu-canvas-skill"
Issues = "https://github.com/leinfinitr/sjtu-canvas-skill/issues"

[project.scripts]
main = "scripts.main:main"
sjtu-canvas = "scripts.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts"]
